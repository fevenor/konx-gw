name: 检查与双架构镜像

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 代码检查
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: astral-sh/setup-uv@v10
      - name: 构建、静态检查与测试
        run: |
          go build ./...
          go vet ./...
          go test ./...
          uv run --no-project --with aiohttp python -m unittest discover -s tests -v
      - name: 确定镜像名称
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  build:
    name: 构建 ${{ matrix.arch }} 镜像
    needs: check
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建架构镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ needs.check.outputs.image }}:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  publish:
    name: 合并多架构标签
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 发布并检查镜像索引
        env:
          IMAGE_NAME: ${{ needs.check.outputs.image }}
          BUILD_TAG: build-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          tags=(--tag "$IMAGE_NAME:sha-$GITHUB_SHA")
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tags+=(--tag "$IMAGE_NAME:latest")
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tags+=(--tag "$IMAGE_NAME:$GITHUB_REF_NAME")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE_NAME:$BUILD_TAG-amd64" "$IMAGE_NAME:$BUILD_TAG-arm64"
          docker buildx imagetools inspect "$IMAGE_NAME:sha-$GITHUB_SHA" --raw \
            | jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | unique == ["amd64", "arm64"]'
